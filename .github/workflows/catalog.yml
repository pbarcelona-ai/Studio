name: Catalog check
on:
  schedule:
    - cron: "0 6 * * 1"        # every Monday
  workflow_dispatch:
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_catalog.py
        working-directory: .
        env:
          PYTHONPATH: scripts
