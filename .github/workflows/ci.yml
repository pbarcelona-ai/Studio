name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pytest-cov ruff mypy pillow imageio-ffmpeg
      - run: ruff check .
      - run: mypy
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: for f in web/static/js/*.js; do node --check "$f"; done
      - run: npm install --silent
        working-directory: tests/js
      - run: pytest --cov=scripts
