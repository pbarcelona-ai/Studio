name: CI
on:
  push:
  pull_request:
jobs:
  test:
    # The Studio must work on Windows as well as macOS (BOOK_TO_SCREEN_BUILD.md rule 11), so every push is tested on all three.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pytest-cov ruff mypy pillow imageio-ffmpeg pypdf numpy opencv-python-headless
      - run: ruff check .
      - run: mypy
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: for f in web/static/js/*.js; do node --check "$f"; done
      - run: npm install --silent
        working-directory: tests/js
      - run: pytest --cov=scripts
      - run: coverage report --include='scripts/studio_app/*' --fail-under=85
        if: matrix.os == 'ubuntu-latest'
      - run: coverage report --fail-under=90
        if: matrix.os == 'ubuntu-latest'
